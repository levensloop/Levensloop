<title>Levensloop v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Pacifico&family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: phone app. Blue top bar with who-you-are and saldo, a scrolling life log grouped per age,
   stat bars + tab bar with a raised green age button. Sheets slide up from the bottom; events are centered cards. */
:root{
  --bg:#e9edf4; --surface:#ffffff; --soft:#f4f6fa; --ink:#172033; --muted:#647089; --line:#e0e5ee;
  --brand:#0a57a6; --brand-2:#084886; --brand-ink:#ffffff; --brand-soft:#e4eefa;
  --bar:#0e1015; --cream:#fdf6de; --cream-line:#efe2b6; --tab:#0a57a6; --tab-2:#084886; --tab-ic:#27c2d6;
  --name:#1a5fc4; --cash:#1b9a3a; --age:#16a53a; --age-2:#0e862c; --back:#e2393f; --track:#dde5ef;
  --go:#17a05a; --go-2:#0f7f45;
  --good:#1f9d55; --mid:#e0a11b; --warn:#ec7a24; --bad:#dc4242;
  --good-soft:#e3f5ea; --bad-soft:#fde8e8; --mid-soft:#fdf3dc;
  --shade:rgba(16,24,44,.48);
  --f-display:ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,'Baloo 2','Nunito',system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Segoe UI',Roboto,'Nunito',sans-serif;
  --r:14px;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
input,select{font:inherit;color:var(--ink)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;max-width:560px;margin:0 auto;position:relative;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:10px 16px;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:800;font-size:16px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.go{background:var(--go)} .btn.go:active{background:var(--go-2)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.bad{background:var(--bad)}
.btn.sm{min-height:38px;font-size:14px;padding:6px 12px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btnrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px}

/* ---------- start ---------- */
#scr-start .scroll{padding-block:28px 32px;display:flex;flex-direction:column;gap:22px}
.brand-mark{display:flex;flex-direction:column;gap:6px}
.brand-mark h1{font-size:46px;font-weight:800;color:var(--brand);letter-spacing:-.5px}
.brand-mark p{margin:0;color:var(--muted);font-size:16px;max-width:30ch}
.timeline-deco{display:flex;gap:6px;align-items:center}
.timeline-deco i{height:8px;border-radius:4px;background:var(--brand-soft);flex:1}
.timeline-deco i:nth-child(1){background:var(--go);flex:.6}
.timeline-deco i:nth-child(2){background:var(--brand);flex:1.4}
.timeline-deco i:nth-child(3){background:var(--mid);flex:1.1}
.timeline-deco i:nth-child(4){background:var(--warn);flex:.7}
.sec-l{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.savecard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.savecard+.savecard{margin-top:8px}
.tline{display:grid;gap:6px}.tline div{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:baseline;font-size:14.5px;line-height:1.35}.tline b{font-variant-numeric:tabular-nums;color:var(--brand);text-align:right}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.nums div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;display:grid;gap:1px}.nums span{font-size:20px}.nums b{font-size:15px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.nums small{font-size:11px;color:var(--muted)}
.savecard .meta{flex:1;min-width:0}
.savecard b{display:block;font-size:16px}
.savecard small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand-2);letter-spacing:.02em}
.pill.dead{background:#eceef3;color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.sync{font-size:12px;color:var(--muted)}

/* ---------- create ---------- */
.topbar{background:var(--brand);color:var(--brand-ink);padding-block:12px;display:flex;align-items:center;gap:10px}
.topbar h2{font-size:21px;flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px;fill:currentColor}
.form{padding-block:18px 28px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-weight:800;font-size:13px;color:var(--muted)}
.inrow{display:flex;gap:8px}
.inrow>*{min-width:0}
.inp{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface);font-size:16px}
.inp:focus{border-color:var(--brand);outline:none}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand-2);box-shadow:0 1px 3px rgba(20,30,60,.15)}
.hint{font-size:13px;color:var(--muted);margin:0}

/* ---------- game ---------- */
.top{background:var(--brand);color:var(--brand-ink);padding-block:10px;display:flex;align-items:center;gap:10px;flex:none}
.who{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;flex:none;background:#fff;color:var(--brand)}
.who .nm{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .sub{font-size:13px;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who>div:last-child{min-width:0}
.money{text-align:right;flex:none}
.money b{display:block;font-family:var(--f-display);font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.money b.long,.prof .money b.long{font-size:16px;letter-spacing:-.3px}
.money small{font-size:12px;opacity:.85}
#log{padding-block:10px 18px}
.agegrp{padding-block:6px}
.age-h{display:flex;align-items:baseline;gap:8px;margin:8px 0 4px}
.age-h b{font-family:var(--f-display);font-size:18px;color:var(--brand-2)}
.age-h span{font-size:12px;color:var(--muted);font-weight:700}
.ln{margin:2px 0;font-size:15px}
.ln .mo{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;margin-right:6px;letter-spacing:.04em}
.ln.good{color:#167a42}
.ln.bad{color:#b83131}
.ln.big{font-weight:800}
.ln.sys{color:var(--muted);font-style:italic}
.bottom{border-top:1px solid var(--line);background:var(--surface);flex:none;padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;padding-block:10px 6px;width:100%;text-align:left}
.stat{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-size:13px;font-weight:700}
.stat .bar{grid-column:1/-1}
.stat .v{font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:#e6eaf2;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .4s ease}
nav.tabs{display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:end;padding-top:2px}
nav.tabs>button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:12px;font-weight:800;color:var(--muted)}
nav.tabs>button svg{width:24px;height:24px;fill:currentColor}
nav.tabs>button:active{color:var(--brand)}
.agebtn{position:relative}
.agebtn .circ{width:68px;height:68px;margin-top:-28px;border-radius:50%;background:var(--go);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 var(--go-2),0 8px 18px rgba(23,160,90,.35);border:4px solid var(--surface);transition:transform .08s}
.agebtn:active .circ{transform:translateY(2px);box-shadow:0 2px 0 var(--go-2)}
.agebtn .circ svg{width:30px;height:30px;fill:#fff}
.agebtn span{color:var(--go-2)}
.agebtn[disabled]{opacity:.5}

/* ---------- sheet ---------- */
.overlay{position:fixed;inset:0;background:var(--shade);z-index:50;display:flex;justify-content:center;align-items:flex-end}
.overlay.center{align-items:center;padding:16px}
.sheet{width:100%;max-width:560px;max-height:90%;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:6px;padding-block:8px;flex:none}
.sheet-h h2{flex:1;font-size:20px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-b{overflow-y:auto;padding-block:6px max(20px,env(safe-area-inset-bottom,0px))}
.sec{padding-top:14px}
.sec>.sec-l{padding-bottom:4px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 0;border-bottom:1px solid var(--line);min-height:56px}
.row:last-child{border-bottom:0}
.row .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand-2)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:800;font-size:15px}
.row .tx small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.row .rt{flex:none;text-align:right;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.row .chev{width:8px;height:8px;border-right:2px solid #b3bccc;border-top:2px solid #b3bccc;transform:rotate(45deg);flex:none;margin-right:4px}
.row[disabled]{opacity:.45;cursor:default}
.row .mini{width:72px;flex:none}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--soft);display:flex;flex-direction:column;gap:8px;margin-top:10px}
.card h3{font-size:19px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:16px 0;color:var(--muted);font-size:14px}

/* ---------- modal ---------- */
.mcard{width:min(420px,100%);max-height:100%;overflow-y:auto;background:var(--surface);border-radius:18px;box-shadow:0 20px 50px rgba(10,20,50,.35);animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:.3}to{transform:none;opacity:1}}
.mhead{background:var(--brand);color:var(--brand-ink);padding:14px 18px;border-radius:18px 18px 0 0}
.mhead.good{background:var(--go)} .mhead.bad{background:var(--bad)} .mhead.dark{background:var(--ink)}
.mhead h3{font-size:21px}
.mhead small{display:block;opacity:.85;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.mbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.mbody p{margin:0;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--soft)}
.chip.up{background:var(--good-soft);color:var(--good)}
.chip.dn{background:var(--bad-soft);color:var(--bad)}
.choices{display:flex;flex-direction:column;gap:8px}
.choices .btn{justify-content:flex-start;text-align:left;font-weight:700;background:var(--brand-soft);color:var(--brand-2);min-height:46px}
.choices .btn:active{background:#d6e1fb}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:80;max-width:min(90vw,420px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

/* ---------- death ---------- */
#scr-death .scroll{padding-block:0 28px}
.rip{background:var(--ink);color:#fff;padding-block:26px 22px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.rip small{letter-spacing:.14em;text-transform:uppercase;font-weight:800;font-size:12px;opacity:.7}
.rip h1{font-size:34px}
.rip .dates{font-variant-numeric:tabular-nums;opacity:.85;font-weight:700}
.score{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;margin-top:8px;background:conic-gradient(var(--go) calc(var(--p)*1%),rgba(255,255,255,.14) 0)}
.score b{width:74px;height:74px;border-radius:50%;background:var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:28px;line-height:1}
.score b em{display:block;font-style:normal;font-size:11px;font-family:var(--f-body);opacity:.7}
.story{padding-block:18px 4px;display:flex;flex-direction:column;gap:10px}
.story p{margin:0;font-size:16px;line-height:1.6;max-width:62ch}
.story .first::first-letter{font-family:var(--f-display);font-size:2.3em;float:left;line-height:.9;margin:4px 6px 0 0;color:var(--brand)}
.achs{display:flex;flex-wrap:wrap;gap:6px}
.ach{font-size:13px;font-weight:800;padding:5px 10px;border-radius:10px;background:var(--mid-soft);color:#8a5d00}
.dsec{display:flex;flex-direction:column;gap:10px;padding-top:18px}

/* ---------- minigames ---------- */
.tbar{position:relative;height:46px;border-radius:12px;background:var(--soft);overflow:hidden;border:1.5px solid var(--line)}
.tzone{position:absolute;top:0;bottom:0;background:var(--good-soft);border-left:2px solid var(--good);border-right:2px solid var(--good)}
.tmark{position:absolute;top:4px;bottom:4px;width:6px;border-radius:3px;background:var(--ink);margin-left:-3px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.hit{background:var(--good)} .dots i.miss{background:var(--bad)}
.examq{font-family:var(--f-display);font-size:34px;text-align:center;font-variant-numeric:tabular-nums}
.timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--warn);transition:width 1s linear}
.hand{display:flex;gap:6px;flex-wrap:wrap;min-height:76px;align-items:center}
.pc{width:50px;height:72px;border-radius:8px;border:1.5px solid var(--line);background:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:4px 6px;font-weight:800;font-size:17px;box-shadow:0 2px 4px rgba(20,30,60,.08)}
.pc.red{color:var(--bad)} .pc.back{background:repeating-linear-gradient(45deg,var(--brand),var(--brand) 5px,var(--brand-2) 5px,var(--brand-2) 10px);border-color:var(--brand-2)}
.pc span:last-child{align-self:flex-end;transform:rotate(180deg)}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.reel{aspect-ratio:1;max-width:100%;border-radius:14px;background:var(--soft);border:1.5px solid var(--line);display:grid;place-items:center;font-size:42px}
.reel.spin{animation:spin .12s linear infinite}
@keyframes spin{0%{transform:translateY(-4px)}50%{transform:translateY(4px)}100%{transform:translateY(-4px)}}
.big-n{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
/* ---------- layout v2: zwarte bovenbalk, crème profielstrook, blauwe tabbalk met grote leeftijdknop, statistieken onderaan ---------- */
.appbar{background:var(--bar);color:#fff;display:flex;align-items:center;gap:12px;padding-block:8px;flex:none}
.appbar .ring{border:2.5px solid #fff;border-radius:50%;width:42px;height:42px}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:25px;letter-spacing:.3px;flex:1;line-height:1}
.appbar-r{font-size:13px;font-weight:700;opacity:.7;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.prof{background:var(--cream);border-bottom:1px solid var(--cream-line);display:flex;align-items:center;gap:10px;padding-block:8px;flex:none}
.face{width:48px;height:48px;display:grid;place-items:center;font-size:40px;line-height:1;flex:none}
.who-t{display:flex;flex-direction:column;min-width:0}
.prof .nm{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--name);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof .nm #h-name{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.prof .sub{font-size:15px;color:var(--name);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof .money b{color:var(--cash);font-size:21px;font-weight:800}
.prof .money small{color:var(--name);font-size:15px;opacity:1}
.age-h{margin:14px 0 2px}
.age-h b{color:var(--name);font-size:21px}
.ln{font-size:16.5px;color:var(--ink);margin:1px 0;line-height:1.4}
.ln.good,.ln.bad{color:var(--ink)}
.bottom2{flex:none;background:var(--cream)}
.tabbar{background:var(--tab);display:grid;grid-template-columns:1fr 1fr 100px 1fr 1fr;height:90px;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar>button{min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-weight:700;font-size:12.5px;border-right:1px solid rgba(255,255,255,.14)}
.tabbar>button:nth-child(4){border-left:1px solid rgba(255,255,255,.14)}
.tabbar>button:active{background:var(--tab-2)}
.tic{width:46px;height:46px;border-radius:50%;background:var(--tab-ic);display:grid;place-items:center}
.tic svg{width:26px;height:26px;fill:#fff}
.agewrap{position:relative;height:100%}
.agebig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:110px;height:110px;border-radius:50%;background:var(--age);border:5px solid #fff;box-shadow:0 3px 0 var(--age-2),0 6px 16px rgba(0,0,0,.28);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.agebig svg{width:40px;height:40px;fill:#fff;margin-top:-6px}
.agebig span{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1;margin-top:0}
.agebig:active{transform:translate(-50%,calc(-50% + 2px))}
.agebig[disabled]{opacity:.55}
.backbtn{position:absolute;right:-24px;bottom:-34px;width:50px;height:50px;border-radius:50%;background:var(--back);border:3px solid #fff;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.28)}
.backbtn b{font-size:24px;line-height:.75}
.backbtn span{font-size:11px;font-weight:800}
#stats.srows{display:flex;flex-direction:column;gap:6px;padding-block:28px max(12px,env(safe-area-inset-bottom,0px));background:var(--cream);width:100%}
.srow{display:grid;grid-template-columns:minmax(0,118px) 26px 1fr 54px;align-items:center;gap:6px}
.srow .sl{text-align:right;font-weight:800;font-size:16px;color:var(--name);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sl i{font-style:normal;color:var(--bad);margin-right:4px}
.srow .se{font-size:19px;text-align:center;line-height:1}
