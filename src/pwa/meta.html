<style>
/* basis die de artifact-viewer anders zelf toevoegt */
html{background:#ffffff}
body{margin:0;font:14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
img{max-width:100%}[hidden]{display:none!important}
html,body{-webkit-text-size-adjust:100%;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
#pwa-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 8px);z-index:9999;max-width:calc(100% - 32px);background:#0e1015;color:#fff;border-radius:999px;padding:10px 16px;font:600 14px -apple-system,system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25);border:0;text-align:center}
#pwa-hint{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:9998;background:#fff;color:#172033;border-radius:16px;padding:14px 44px 14px 16px;font:14px/1.4 -apple-system,system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#pwa-hint b{display:block;margin-bottom:2px}#pwa-hint button{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:#eef2f7;font-size:16px}
</style>
